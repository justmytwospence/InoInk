[package]
name = "inoink"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Renderer-independent Inoreader client: API, SQLite store, content cache and sync"

[dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
url = "2.5.8"
sha2 = "0.11.1"
percent-encoding = "2.3.2"
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3.27.0"
