# inoink-bench settings (doc/INOINK-BENCHMARKS.md). Every line is optional: a missing one uses its
# default, computed from the screen size and InoInk's layout. The values shown are the defaults
# on the Libra Colour in portrait; uncomment a line to change it. Positions are screen pixels.

# Scenarios after startup, in this order.
# scenarios = sync,list,article
# Article opens and list page turns; page turns in the first article; syncs.
# samples = 5
# page_turns = 10
# sync_samples = 3

# The screen has settled after this long without a change; an action may take this long.
# quiet_ms = 800
# timeout_ms = 15000
# sync_timeout_ms = 120000
# startup_timeout_ms = 240000
# Before the scenarios, the screen must stay unchanged this long (the startup sync).
# startup_quiet_ms = 8000
# Pixels per compared cell of the screen.
# cell = 24

# The first row of the list, the sync button and its icon, the middle of an article (shows its
# bars) and the article's title (goes back to the list).
# tap_article = 505,324
# tap_sync = 928,60
# sync_icon = 880,0,976,120
# tap_bars = 632,840
# tap_back = 379,60
# Changes here never count (the clock and the battery); several areas separated by ";".
# ignore = 0,0,421,120
